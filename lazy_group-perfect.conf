# ======= QUIC 拒绝（墨鱼原版保留）：强制油管走 TCP，部分线路上 UDP/QUIC 会被限速或不稳，TCP 反而更快更稳，且 MITM 对 QUIC 无效======= #
AND,((DOMAIN-SUFFIX,googlevideo.com), (PROTOCOL,UDP)),REJECT
AND,((DOMAIN,youtubei.googleapis.com), (PROTOCOL,UDP)),REJECT
# ======= 去广告（轻量：只用 blackmatrix7 Advertising.list 792 行；已砍 Cats-Team 21.5 万行整表）======= #
# 墨鱼系去广告模块（MITM）是去广告主力；本表只补模块盖不到的通用广告域。核心功能域名一律不在此表（已逐条核对）。
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Advertising/Advertising.list,REJECT
# 补两条油管/通用广告域（不在上表里，纯广告域，不影响正常功能）：
DOMAIN-SUFFIX,googleads.g.doubleclick.net,REJECT
DOMAIN-SUFFIX,pagead2.googlesyndication.com,REJECT
# ======= 分流 ======= #
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/TikTok/TikTok.list,全球加速
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/GlobalMedia/GlobalMedia.list,国际媒体
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/BiliBili/BiliBili.list,哔哩哔哩
# Apple.list 与 China.list 用 QuantumultX 文件夹完整版（Shadowrocket 文件夹是 53 行 / 73 行的残表，已实测确认）：
RULE-SET,https://raw.githubusercontent.com/saiyanmuse996/shadowrocket-config/main/shadowrocket-apple-clean.list,苹果服务
RULE-SET,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyGFWlist.list,全球加速
DOMAIN-SUFFIX,sinaimg.cn,DIRECT
RULE-SET,https://raw.githubusercontent.com/saiyanmuse996/shadowrocket-config/main/shadowrocket-china-clean.list,DIRECT
GEOIP,CN,DIRECT,no-resolve
FINAL,兜底分流


[Host]

*testflight.apple.com = server:8.8.4.4


[URL Rewrite]

# ======= G重定向  ======= #
^https?://(www.)?g.cn https://www.google.com 302
^https?://(www.)?google.cn https://www.google.com 302

# ======= 广告请求 ======= #
(^https?:\/\/[\w-]+\.googlevideo\.com\/(?!dclk_video_ads).+?)&ctier=L(&.+?),ctier,(.+) $1$2$3 302 
^https?:\/\/[\w-]+\.googlevideo\.com\/(?!(dclk_video_ads|videoplayback\?)).+&oad - reject

# ======= 需要手动添加模块 ====== #
# > 1 墨鱼去广告模块 去 ddgksf2013.top 一键添加


[Script]

# 油管增强（墨鱼原版，Maasea 的 youtube.response.js，用户 2026-11-27 23:47 亲口定：原样不动，YouTube 已无广告；已验活 200）：
油管增强 = type=http-response, pattern=^https:\/\/youtubei\.googleapis\.com\/(youtubei\/v1\/(browse|next|player|search|reel\/reel_watch_sequence|guide|account\/get_setting|get_watch))(\?(.*))?$,requires-body=1,max-size=-1,binary-body-mode=1,script-path=https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.response.js,argument="{"lyricLang":"{{{歌词翻译语言}}}","captionLang":"{{{字幕翻译语言}}}","blockUpload":{{{屏蔽上传按钮}}},"blockImmersive":{{{屏蔽选段按钮}}},"blockShorts":{{{屏蔽Shorts按钮}}},"debug":{{{启用调试模式}}}}"
网页变身 = type=http-response, pattern=^https?:\/\/ddgksf2013.top\/$,requires-body=1,max-size=-1,script-path=https://ddgksf2013.top/scripts/web.rocket.js, timeout=3500
脚本转换 = type=http-request, pattern=^https?:\/\/script\.hub\/file\/_start_\/.+type=(?:qx-rewrite|surge-module|all-module), script-path=https://raw.githubusercontent.com/Script-Hub-Org/Script-Hub/main/Rewrite-Parser.js, timeout=300
# 时区伪装（新增，用户 2026-11-27 23:47 要的）：把网页的时区伪装成纽约（America/New_York），防网站读到设备真实时间。
# 脚本文件 shadowrocket-tz-spoof.js（3,441 字节）随本配置一起推 GitHub，用 raw 地址引用，不用会过期的临时链接。
# 上限（必须如实说）：只对走代理的网页生效（MitM 注入改 Date/Intl）；原生 App 直接读 iOS 系统时区，代理配置拦不住，别指望 App 也能伪装。
# 严格 CSP 的站可能拦住注入脚本；用 getHours()/getUTCHours() 直接算偏移的检测方式伪装不住（脚本自带说明）。
时区伪装 = type=http-response, pattern=^https:\/\/([^\/]+\.)?(chatgpt\.com|openai\.com|claude\.ai|anthropic\.com|gemini\.google\.com|aistudio\.google\.com|deepseek\.com|grok\.com|x\.ai|perplexity\.ai|hackerone\.com|x\.com|discord\.com|medium\.com|quora\.com|signal\.org|sora\.com|poe\.com|mistral\.ai|huggingface\.co|openrouter\.ai|cursor\.com)\/,requires-body=1,max-size=-1,script-path=https://raw.githubusercontent.com/saiyanmuse996/shadowrocket-config/main/shadowrocket-tz-spoof.js, timeout=3000


[MITM]

# > Shadowrocket 仅会解密 hostname 指定的域名的请求，可以使用通配符。也可以使用前缀 - 排除特定主机名，如 -*.example.com
# > iOS 系统和某些应用有严格的安全策略，仅信任某些特定的证书，对这些域名启动解密可能导致问题，如 *.apple.com，*.icloud.com。
# > MITM 证书字段已略去，沿用用户手机已装的 CA。
# > hostname 只列配置自身脚本需要的域名；各去广告模块在模块文件里自带 hostname，安装后自动生效，不用在此重复列。
# > 新增排除 U 卡域名（-*.kraken.com、-*.krak.app、-*.bybit.com）：钱相关流量不解密，模块也不需要解密它们。
# > 时区伪装要用的域名（脚本 HOSTS 表里的 22 个）也已加进 hostname，否则脚本看不到解密后的网页内容、注入不生效。
# > 省电：MITM 只覆盖上面这些域名，不扩大；解密耗 CPU，范围越大越费电。
hostname = youtubei.googleapis.com, script.hub, *.script.hub, ddgksf2013.top, *.googlevideo.com, *.google.cn, chatgpt.com, *.chatgpt.com, openai.com, *.openai.com, claude.ai, *.claude.ai, anthropic.com, *.anthropic.com, gemini.google.com, *.gemini.google.com, aistudio.google.com, *.aistudio.google.com, deepseek.com, *.deepseek.com, grok.com, *.grok.com, x.ai, *.x.ai, perplexity.ai, *.perplexity.ai, hackerone.com, *.hackerone.com, x.com, *.x.com, discord.com, *.discord.com, medium.com, *.medium.com, quora.com, *.quora.com, signal.org, *.signal.org, sora.com, *.sora.com, poe.com, *.poe.com, mistral.ai, *.mistral.ai, huggingface.co, *.huggingface.co, openrouter.ai, *.openrouter.ai, cursor.com, *.cursor.com, -consumer.fcbox.com, -*huami.com, -*amemv.com, -*snssdk.com, -www.google.com, -*.kraken.com, -*.krak.app, -*.bybit.com
enable = true
